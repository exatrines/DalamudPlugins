name: Update pluginmaster.json

on:
  push:
    branches:
      - main
    paths:
      - manifests
      - .github/scripts/build_pluginmaster.py
      - .github/scripts/update_readme.py
      - .github/workflows/update-pluginmaster.yml
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pluginmaster.json
        run: python3 .github/scripts/build_pluginmaster.py manifests pluginmaster.json

      - name: Update README plugins table
        run: python3 .github/scripts/update_readme.py pluginmaster.json README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update pluginmaster.json"
          file_pattern: pluginmaster.json README.md
